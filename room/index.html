<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Gaze...</title>
  <style>
    body {
      margin: 0;
      background: #0A0A0A;
      color: #F4F0EB;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    p { color: #6B6B78; font-size: 14px; margin-top: 12px; }
  </style>
</head>
<body>
  <div>
    <div style="font-size: 22px; font-weight: bold; letter-spacing: 2px;">GAZE</div>
    <p>Opening room…</p>
  </div>
  <script>
    var id = new URLSearchParams(window.location.search).get('id');
    if (id) {
      window.location.replace('gaze://room/' + id);
    }
  </script>
</body>
</html>
